<dom-module id="nuxeo-admin-center">
  <template>
    <style include="iron-flex iron-flex-alignment nuxeo-styles">
      /* For displaying cards side-by-side */
      .right {
        margin-left: 16px;
      }

      /* For icons that appear inline with text. */
      .small-icon {
        --iron-icon-height: 1rem;
        --iron-icon-width: 1rem;
      }

      /* For paper-icon-item icons */
      .warning {
        color: orange;
      }

      /* Cards should not be indented from outer edge. */
      .card-wrapper {
        margin-left: -8px;
        margin-right: -8px;
      }

      .admin-center-card {
        min-width: 500px;
        margin-left: 8px;
        margin-right: 8px;
      }
    </style>

    <nuxeo-page>

      <div slot="header">
        <div>[[i18n('nxpac.label.admin-center-page-header')]]</div>
      </div>

      <div class="content">

        <!-- First row -->
        <div class="layout flex horizontal">

          <!--== About ========================================================-->
          <nuxeo-card heading="Admin Center Info"
                      class="layout flex"
                      id="aboutCard"
                      on-tap="_syncHealthCheckCard"
                      collapsible
                      opened>

            <paper-icon-item>
              <iron-icon icon="icons:info"
                         slot="item-icon">
              </iron-icon>
              <div>This interface was created to replace <a href="https://doc.nuxeo.com/n/9CF"
                   target="_blank">Nuxeo JSF UI Admin features<iron-icon class="small-icon"
                             icon="icons:open-in-new"></iron-icon></a>.</div>
            </paper-icon-item>

            <paper-icon-item>
              <iron-icon icon="icons:info"
                         slot="item-icon">
              </iron-icon>
              <div>This may eventually be replaced by the <a href="https://doc.nuxeo.com/n/WYr"
                   target="_blank">Nuxeo Admin Console<iron-icon class="small-icon"
                             icon="icons:open-in-new"></iron-icon></a>.</div>
            </paper-icon-item>

            <paper-icon-item>
              <iron-icon icon="icons:info"
                         slot="item-icon">
              </iron-icon>
              <div>Note: use the <a href="https://doc.nuxeo.com/n/9CF"
                   target="_blank">Nuxeo Dev Tools Extension<iron-icon class="small-icon"
                             icon="icons:open-in-new"></iron-icon></a> to
                handle dev tasks (hot reload, reindex,
                restart).</div>
            </paper-icon-item>

            <paper-icon-item>
              <iron-icon icon="icons:info"
                         slot="item-icon">
              </iron-icon>
              <div>Refer to the <a href="https://doc.nuxeo.com/n/WLK"
                   target="_blank">Management Endpoint documentation<iron-icon class="small-icon"
                             icon="icons:open-in-new"></iron-icon></a> for more details.</div>
            </paper-icon-item>

            <paper-icon-item>
              <iron-icon icon="icons:warning"
                         slot="item-icon"
                         class="warning"></iron-icon>
              <div>In a Nuxeo cluster environment, some of the information displayed here
                applies only to the node you are connected to.</div>
            </paper-icon-item>
          </nuxeo-card>

          <!--== Health Check ===============================================-->
          <nuxeo-card heading="Nuxeo Server Health Check"
                      class="right"
                      id="healthCheckCard"
                      on-tap="_syncAboutCard"
                      collapsible
                      opened>
            <nxpac-health-check></nxpac-health-check>
          </nuxeo-card>

        </div>

        <!--== Actions ======================================================-->
        <div class="layout flex horizontal wrap card-wrapper">

          <nxpac-basic-action heading="nxpac.label.action.download-log"
                              description="nxpac.label.description.download-log"
                              operation="javascript.adminCenter_downloadServerLog"
                              download
                              async
                              class="layout flex admin-center-card"
                              notification="nxpac.label.notification.download-log">
          </nxpac-basic-action>

          <nxpac-basic-action heading="nxpac.label.action.download-conf"
                              description="nxpac.label.description.download-conf"
                              operation="javascript.adminCenter_downloadConf"
                              download
                              async
                              class="layout flex admin-center-card"
                              notification="nxpac.label.notification.download-conf">
          </nxpac-basic-action>

          <admin-nuxeo-distribution class="layout flex admin-center-card"></admin-nuxeo-distribution>

          <nxpac-basic-action heading="nxpac.label.action.reindex-repository"
                              description="nxpac.label.description.reindex-repository"
                              operation="Elasticsearch.Index"
                              class="layout flex admin-center-card"
                              notification="nxpac.label.notification.reindex-repository">
          </nxpac-basic-action>

        </div>

      </div>

    </nuxeo-page>

  </template>

  <script>
    Polymer({
      is: 'nuxeo-admin-center',
      behaviors: [Nuxeo.LayoutBehavior],
      properties: {
      },

      // If the About card is toggled, also toggle the Health Check card.
      _syncHealthCheckCard: function () {
        this.$.healthCheckCard.opened = this.$.aboutCard.opened;
      },

      // If the Health Check card is toggled, also toggle the About card.
      _syncAboutCard: function () {
        this.$.aboutCard.opened = this.$.healthCheckCard.opened;
      }
    });
  </script>
</dom-module>
