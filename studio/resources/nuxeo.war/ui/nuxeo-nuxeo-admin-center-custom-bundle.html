<!--== Server Log ===========================================================-->
<nuxeo-slot-content name="adminCenter_downloadServerLog"
                    slot="ADMIN_CENTER">
  <template>
    <nxpac-basic-action heading="nxpac.label.action.download-log"
                        description="nxpac.label.description.download-log"
                        operation="javascript.adminCenter_downloadServerLog"
                        download
                        async
                        notification="nxpac.label.notification.download-log">
    </nxpac-basic-action>
  </template>
</nuxeo-slot-content>

<!--== ShowConf ===========================================================-->
<nuxeo-slot-content name="adminCenter_downloadConf"
                    slot="ADMIN_CENTER">
  <template>
    <nxpac-basic-action heading="nxpac.label.action.download-conf"
                        description="nxpac.label.description.download-conf"
                        operation="javascript.adminCenter_downloadConf"
                        download
                        async
                        notification="nxpac.label.notification.download-conf">
    </nxpac-basic-action>
  </template>
</nuxeo-slot-content>

<!--== Nuxeo Server Info ====================================================-->
<nuxeo-slot-content name="adminCenter_distribution"
                    slot="ADMIN_CENTER">
  <template>
    <admin-nuxeo-distribution></admin-nuxeo-distribution>
  </template>
</nuxeo-slot-content>

<!--== Reindex ==============================================================-->
<nuxeo-slot-content name="adminCenter_reindex"
                    slot="ADMIN_CENTER">
  <template>
    <nxpac-basic-action class="layout flex"
                        heading="nxpac.label.action.reindex-repository"
                        description="nxpac.label.description.reindex-repository"
                        operation="Elasticsearch.Index"
                        notification="nxpac.label.notification.reindex-repository">
    </nxpac-basic-action>
  </template>
</nuxeo-slot-content>

<!--== Orphaned Versions ====================================================-->
<nuxeo-slot-content name="adminCenter_orphaned-versions"
                    slot="ADMIN_CENTER">
  <template>
    <nxpac-basic-action heading="nxpac.label.action.gc-orphaned-versions"
                        description="nxpac.label.description.gc-orphaned-versions"
                        url="/nuxeo/api/v1/management/versions/orphaned"
                        method="DELETE">
    </nxpac-basic-action>
  </template>
</nuxeo-slot-content>

<!--== Orphaned Workflows ===================================================-->

                        method="DELETE">

</nuxeo-slot-content>
